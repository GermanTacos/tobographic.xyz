<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>unrivaled</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&amp;display=swap">

        <!-- Site-wide base, then the dashboard styles shared by every standings page. Adjust these paths if this folder moves. -->
        <link rel="stylesheet" href="../../style.css">
        <link rel="stylesheet" href="../dashboard.css">
    </head>

    <body>
        <section class="dashboard">
            <header>
                <h1>unrivaled</h1>
            </header>
            <main class="standings">
                <div id="conferences" class="conferences"></div>
                <p id="message" class="message">loading…</p>
            </main>
            <footer class="back">
                <p id="key" class="key" hidden>
                    <span><span class="swatch direct"></span>bye</span>
                    <span><span class="swatch playoff"></span>playoff</span>
                </p>
                <h3><a href="../../">back</a></h3>
            </footer>
        </section>

        <!-- Order matters: shared code first, then standings, then the optional live-game layer and its easter egg. -->
        <!-- unrivaled.basketball and Sportradar don't send CORS headers, so every request goes through this Cloudflare Worker. It adds the Sportradar api_key itself, so the key never reaches the browser. -->
        <script src="../dashboard.js" data-proxy="https://hidden-sea-74d9.tiny-river-02cf.workers.dev/?url=" defer></script>
        <script src="scripts/standings.js" defer></script>
        <script src="scripts/live.js" defer></script>
        <script src="../egg.js" data-player="Paige Bueckers" data-bg="#4a4077" data-accent="#b13679" data-text="#ffffff" defer></script>
    </body>
</html>
