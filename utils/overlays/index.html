<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=480">
	<meta charset="utf-8">
	
	<title>Overlay Picker</title>
	
	<link href="style.css" type="text/css" rel="stylesheet"/>
	
	<script src="scripts/options.js" defer></script>
	<script src="scripts/display.js" defer></script>
</head>

<body>
	<label for="resolution">Target resolution:</label>
		<select name="resolution" id="resolution">
			<option selected value="any">Any</option>
		</select>
		
	<label for="console">Console:</label>
		<select name="console" id="console">
			<option selected value="any">Any</option>
		</select>
		
	<label for="int-scale">Integer-scaled:</label>
		<input name="int-scale" id="int-scale" type="checkbox" checked/>
		
	<label for="int-scale">Offset:</label>
		<input name="offset" id="offset" type="checkbox"/>
		
	<br><br><br><a>work-in-progress</a><br><a>view github repository</a> <strong><a href="https://github.com/germantacos/overlays">here</a></strong>
</body>

</html>
