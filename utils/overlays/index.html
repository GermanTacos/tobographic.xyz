<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	
	<title>Overlay Database</title>
	
	<link href="style.css" type="text/css" rel="stylesheet"/>
	
	<script src="scripts/options.js" defer></script>
	<script src="scripts/index.js" defer></script>
	<script src="scripts/display.js" defer></script>
</head>

<body>
	<label for="resolution">Target resolution:</label>
		<select name="resolution" id="resolution">
			<option selected value="any">Any</option>
		</select>
		
	<label for="console">Console:</label>
		<select name="console" id="console">
			<option selected value="any">Any</option>
		</select>
		
	<label for="intScale">Integer-scaled:</label>
		<input name="intScale" id="intScale" type="checkbox" checked/>
		
	<label for="offset">Offset:</label>
		<input name="offset" id="offset" type="checkbox"/>
		
	<div id="results"></div>
		
	<br><a>view github repository</a> <strong><a href="https://github.com/germantacos/overlays">here</a></strong>
</body>

</html>
