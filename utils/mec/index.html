<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>mec</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&amp;display=swap">

        <!-- Site-wide base, then the dashboard styles shared by every standings page, then this page's additions. Adjust the first two paths if this folder moves. -->
        <link rel="stylesheet" href="../../style.css">
        <link rel="stylesheet" href="../dashboard.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section class="dashboard">
            <header class="with-toggle">
                <h1>mec</h1>
                <label class="toggle"><input type="checkbox" id="conf-only">conf only</label>
            </header>
            <main class="standings">
                <div id="conferences" class="conferences"></div>
                <p id="message" class="message">loading…</p>
            </main>
            <footer class="back">
                <p id="key" class="key" hidden>
                    <span><span class="swatch direct"></span>bye</span>
                    <span><span class="swatch playoff"></span>tournament</span>
                </p>
                <h3><a href="../../">back</a></h3>
            </footer>
        </section>

        <!-- Order matters: shared code first, then standings, then the optional live-game layer and its easter egg. -->
        <!-- mountaineast.org and data.ncaa.com don't send CORS headers, so every request goes through this Cloudflare Worker. Replace the subdomain with yours after deploying. -->
        <script src="../dashboard.js" data-proxy="https://mec-proxy.tiny-river-02cf.workers.dev/?url=" defer></script>
        <script src="scripts/helpers.js" defer></script>
        <script src="scripts/standings.js" defer></script>
        <script src="scripts/live.js" defer></script>
        <script src="../egg.js" data-player="Levi Wanless" data-bg="#ff4c00" data-accent="#000000" data-text="#ffffff" defer></script>
    </body>
</html>
