<!DOCTYPE HTML>

<html>

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <title>tobographic</title>

        <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel="stylesheet" />
        <style>
        /****************************
         *
         * Default Styling
         *
         ****************************/
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        html {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            margin: 0;
        }
        body {
            position: relative;
            font: 1em/1.4 "Microsoft MHei", "Helvetica Neue", "Helvetica", "Arial", sans-serif; /* Replace Source Sans Pro with any font you want */
        }
        /****************************
         *
         * Loading Overlay
         *
         ****************************/
        #loading-overlay {
            position: absolute;
            height: 100%;
            width: 100%;
            background-color: #181818; /* Change the background color, should be the same as section */
            overflow: none;
            z-index: 1337;
        }
        /****************************
         *
         * Section
         *
         ****************************/
        section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 0;
            height: 100%;
            width: 100%;
            background-color: #181818; /* Change the background color, should be the same as #loading-overlay */
			overflow: auto;
        }
        /****************************
         *
         * Header
         *
         ****************************/
        header {
            position: relative;
            margin-top: 25px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 10px;
			width: 500px;
			max-width: 500px;
        }
        header h1 {
			display: inline-block;
            margin-top: 0;
            margin-left: 0px;
            margin-right: 0px;
            margin-bottom: 5px;
            color: #989898; /* Change the greeting text color */
            font-size: 3em;
            font-weight: bold;
            text-align: left;
        }
        header h2 {
            margin: 0;
            color: #888888; /* Change the date text color */
            font-size: 2em;
            font-weight: regular;
            text-align: left;
        }
        /****************************
         *
         * Main
         *
         ****************************/
        main nav {
            padding-top: 10px;
            margin: 0 auto;
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 10px;
            border-bottom-width: 2px;
            border-bottom-style: solid;
            border-bottom-color: #383838; /* Change the bottom border color */
            width: 500px; /* Change width and max-width to increase the amount of nav links */
            max-width: 500px; /* Change width and max-width to increase the amount of nav links */
            
        }
        main nav:first-child {
            border-top-width: 2px;
            border-top-style: solid;
            border-top-color: #383838; /* Change the top border color */
        }
		main nav {
            padding-top: 10px;
            margin: 0 auto;
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 10px;
            border-bottom-width: 2px;
            border-bottom-style: solid;
            border-bottom-color: #383838; /* Change the bottom border color */
            width: 500px; /* Change width and max-width to increase the amount of nav links */
            max-width: 500px; /* Change width and max-width to increase the amount of nav links */
            
        }
        main nav h5 {
            display: inline-block;
            margin: 0;
            padding-right: 5px;
            color: #686868; /* Change the navigation header text color */
            font-size: 1.5em;
            font-weight: 400;
            text-transform: lowercase;
            text-align: left;
        }
		 main nav h6 {
            display: inline-block;
            margin: 0;
            padding-right: 5px;
            color: #181818; /* Change the navigation header text color */
            font-size: 1.5em;
            font-weight: 400;
            text-transform: lowercase;
            text-align: left;
        }
        main nav ul {
            display: inline-block;
            margin: 0;
            padding: 0;
            list-style-type: none;
        }
        main nav ul li {
            display: inline-block;
            padding-top: 0;
            padding-left: 5px;
            padding-right: 5px;
            padding-bottom: 0;
            margin: 0;
			text-align: right;
        }
        main nav ul li a {
            margin: 0;
            padding: 0;
            color: #E5B75B; /* Change the navigation link text color */
            font-size: 1.5em;
            font-weight: 400;
            text-align: right;
            text-decoration: none;
            text-transform: lowercase;
        }
        main nav ul li a:hover,
        main nav ul li a:focus {
            color: #E0CCA8; /* Change the navigation link text color on hover and focus */
            transition: .5s color ease;
        }
        /****************************
         *
         * Footer
         *
         ****************************/
        footer {
            position: relative;
            margin-top: 5px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 25px;
			width: 500px; /* Change width and max-width to increase the amount of nav links */
            max-width: 500px; /* Change width and max-width to increase the amount of nav links */
        }
        footer h3 {
            margin: 0;
            color: #787878; /* Change the time color */
            font-size: 2em;
            font-weight: bold;
            text-align: right;
        }
		/****************************
         *
         * Images
         *
         ****************************/
		.left-image {
			position: absolute;
			bottom: 0px;
			left: 0px;
			width: auto;
			height: 100%;
			filter: drop-shadow(0px 0px 20px #000000);
			z-index: 1337;
		}
		.right-image {
			position: absolute;
			bottom: 0px;
			right: 0px;
			width: auto;
			height: 100%;
			filter: drop-shadow(0px 0px 20px #000000);
			z-index: 1337;
		}
		.map-token {
			position: fixed;
			bottom: 10px;
			right: 10px;
			max-width: 100%;
			z-index: 69;
		}
        </style>
    </head>

    <body>

        <section>

		<img id="random-image" src="https://static.wikia.nocookie.net/fireemblem/images/5/50/FE14_Sumeragi_Swordmaster_Map_Sprite_%28Chapter_5%29.gif" class="map-token"/>

		<script>
			// define images, add to table to add sprites
			document.addEventListener("DOMContentLoaded", () => {
				const images = [
					'https://cdn.fireemblemwiki.org/d/d9/Ma_fe13_lord_lucina_playable.gif',
					'https://cdn.fireemblemwiki.org/5/50/Ma_fe13_dancer_playable.gif',
					'https://cdn.fireemblemwiki.org/a/ae/Ma_fe13_wyvern_rider_cherche_playable.gif',
					'https://cdn.fireemblemwiki.org/7/75/Ma_fe14_fighter_charlotte_playable.gif',
					'https://cdn.fireemblemwiki.org/4/41/Ma_fe14_sky_knight_hinoka_playable.gif',
					'https://cdn.fireemblemwiki.org/8/83/Ma_fe14_maid_felicia_playable.gif',
					'https://cdn.fireemblemwiki.org/0/0e/Ma_fe15_cleric_silque_playable.gif',
					'https://cdn.fireemblemwiki.org/f/f9/Ma_fe15_cleric_genny_playable.gif',
					'https://cdn.fireemblemwiki.org/6/60/Ma_fe15_soldier_lukas_playable.gif',
					'https://cdn.fireemblemwiki.org/5/54/Ma_fe16_brigand_hilda_playable.gif',
					'https://cdn.fireemblemwiki.org/f/f6/Ma_fe16_cavalier_ferdinand_playable.gif',
					'https://cdn.fireemblemwiki.org/f/f1/Ma_fe16_priest_mercedes_playable.gif',
					'https://cdn.fireemblemwiki.org/2/23/Ma_fe17_thief_yunaka.png',
					'https://cdn.fireemblemwiki.org/b/b4/Ma_fe17_wyvern_knight_rosado.png',
					'https://cdn.fireemblemwiki.org/0/0a/Ma_fe17_hero_goldmary.png'
				];
				
				// grab random image from table
				const randomIndex = Math.floor(Math.random() * images.length);
				const imageElement = document.getElementById("random-image");
				
				imageElement.src = images[randomIndex];
			});
		</script>
		
        <script>
			function update_date() {
				let d = new Date();
				document.getElementById("year").innerHTML = d.getFullYear();
				document.getElementById("month").innerHTML = String(d.getMonth() + 1).padStart(2, "0");
				document.getElementById("day").innerHTML = String(d.getDate()).padStart(2, "0");
			}
			// Updates #hour and #minute with current information
			function update_time() {
				var d = new Date();
				document.getElementById("hour").innerHTML = String(d.getHours()).padStart(2, "0");
				document.getElementById("minute").innerHTML = String(d.getMinutes()).padStart(2, "0");
			}
			// Runs update_date and update_time functions
			function update_date_time() {
				update_date();
				update_time();
			}
			// Update date and time
			update_date_time();
			// Make the loading overlay invisible
			document.getElementById("loading-overlay").style.display = "none";
			// Every 60 seconds, update the date and time
			setInterval(function() {
				update_date_time();
			}, 60000);
        </script>
    </body>
</html>
